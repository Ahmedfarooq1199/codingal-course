<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The house of learning</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f8ff;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background: #008080;
      color: white;
      padding: 20px;
      font-size: 28px;
      font-weight: bold;
    }
    .container {
      max-width: 700px;
      margin: 20px auto;
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .question {
      font-size: 20px;
      margin-bottom: 15px;
      font-weight: bold;
    }
    .options button {
      display: block;
      width: 100%;
      margin: 8px 0;
      padding: 12px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #e0f7fa;
      cursor: pointer;
      transition: 0.3s;
    }
    .options button:hover {
      background: #b2ebf2;
    }
    #nextBtn {
      margin-top: 15px;
      padding: 12px 25px;
      font-size: 18px;
      background: #008080;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: none;
    }
    #result {
      font-size: 22px;
      font-weight: bold;
      color: #004d40;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>The House of Learning</header>
  <div class="container">
    <div id="quiz">
      <div id="question" class="question"></div>
      <div id="options" class="options"></div>
      <button id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>
    <div id="result"></div>
  </div>

  <script>
    const quizData = [
      {
        question:"Who is first Prime Minister of Pakistan",
        options:["Allama Iqbal","Hafeez Jhillandri","Liaqat Ali Khan","Muhammad khan junego"],
        answer:"Liaqat Ali Khan",
      },
      {
        question:"What is the National bird of Pakistan",
        options:["Eagle","Peacock","Sparrows","Chakor🐦"],
        answer: "Chakor🐦"
      },
      {
        question:"In which Subcontinent Pakistan locate",
        options: ["Asia","North America","South America","Africa","Antartica"],
        answer: "Asia",
      },
      {
        question: "How many province of Pakistan?",             
        options: ["1","2","3","4","5"],
        answer: "5"
      },
      {
        question: "What is the capital of Pakistan?",
        options: ["Lahore", "Karachi", "Islamabad", "Quetta"],
        answer: "Islamabad"
      },
      {
        question: "Who is the founder of Pakistan?",
        options: ["Allama Iqbal", "Quaid-e-Azam Muhammad Ali Jinnah", "Liaquat Ali Khan", "Sir Syed Ahmad Khan"],
        answer: "Quaid-e-Azam Muhammad Ali Jinnah"
      },
      {
        question: "What is the national language of Pakistan?",
        options: ["Urdu", "Punjabi", "Sindhi", "Pashto"],
        answer: "Urdu"
      },
      {
        question: "Which is the national animal of Pakistan?",
        options: ["Lion", "Markhor", "Elephant", "Horse"],
        answer: "Markhor"
      },
      {
        question: "What is the national sport of Pakistan?",
        options: ["Hockey", "Cricket", "Football", "Kabaddi"],
        answer: "Hockey"
      }
    ];

    let currentQuestion = 0;
    let score = 0;

    function loadQuestion() {
      document.getElementById("result").innerHTML = "";
      const questionElement = document.getElementById("question");
      const optionsElement = document.getElementById("options");
      const nextBtn = document.getElementById("nextBtn");

      let q = quizData[currentQuestion];
      questionElement.innerText = (currentQuestion + 1) + ". " + q.question;
      optionsElement.innerHTML = "";

      q.options.forEach(option => {
        const btn = document.createElement("button");
        btn.innerText = option;
        btn.onclick = () => checkAnswer(option);
        optionsElement.appendChild(btn);
      });

      nextBtn.style.display = "none";
    }

    function checkAnswer(selected) {
      let correct = quizData[currentQuestion].answer;
      if (selected === correct) {
        score++;
        document.getElementById("result").innerHTML = "✅ Correct!";
      } else {
        document.getElementById("result").innerHTML = "❌ Wrong! Correct Answer: " + correct;
      }
      document.getElementById("nextBtn").style.display = "block";
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < quizData.length) {
        loadQuestion();
      } else {
        document.getElementById("quiz").innerHTML = "";
        document.getElementById("result").innerHTML = 
          "🎉 Quiz Finished! <br> You scored " + score + " out of " + quizData.length;
      }
    }

    loadQuestion();
  </script>
</body>
</html>
