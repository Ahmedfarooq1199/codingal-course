<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiniTube</title>
  <style>
    :root{
      --bg:#0f1724; --card:#0b1220; --muted:#9aa4b2; --accent:#ff3333; --glass: rgba(255,255,255,0.03);
      --max-width:1200px;
      color-scheme: dark;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial; background:linear-gradient(180deg,#071022 0%, #081427 100%); color:#e6eef8;}
    .container{max-width:var(--max-width);margin:18px auto;padding:0 16px}

    header{display:flex;align-items:center;gap:16px;padding:12px 0}
    .logo{display:flex;align-items:center;gap:10px;font-weight:700}
    .logo .mark{width:44px;height:28px;background:var(--accent);border-radius:4px;display:inline-block}
    .search{flex:1;display:flex}
    .search input{flex:1;padding:10px 12px;border-radius:6px 0 0 6px;border:0;background:var(--glass);color:inherit}
    .search button{padding:10px 14px;border:0;background:#102033;border-radius:0 6px 6px 0;cursor:pointer}

    main{display:flex;gap:18px}
    nav.sidebar{width:240px;background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);padding:12px;border-radius:8px;height:calc(100vh - 120px);position:sticky;top:18px}
    nav.sidebar .item{padding:8px 10px;border-radius:6px;display:flex;align-items:center;gap:10px;color:var(--muted);cursor:pointer}
    nav.sidebar .item:hover{background:var(--glass);color:inherit}

    .content{flex:1}
    .top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .filters{display:flex;gap:8px}
    .filters button{padding:8px 12px;border-radius:20px;border:0;background:transparent;color:var(--muted);cursor:pointer}

    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
    .card{background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);border-radius:8px;padding:8px}
    .thumb{width:100%;height:130px;border-radius:6px;background:#061426;display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative;overflow:hidden}
    .thumb video{width:100%;height:100%;object-fit:cover}
    .duration{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,0.6);padding:4px 6px;border-radius:4px;font-size:12px}
    .meta{padding-top:8px;display:flex;gap:8px}
    .avatar{width:36px;height:36px;border-radius:50%;background:#152433}
    .meta .info{flex:1}
    .meta .info h4{margin:0;font-size:14px}
    .meta .info p{margin:4px 0 0;font-size:13px;color:var(--muted)}

    /* Modal player */
    .modal{position:fixed;inset:0;background:rgba(2,6,23,0.7);display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:all 180ms}
    .modal.open{opacity:1;pointer-events:auto}
    .player{width:min(1000px,96%);background:#071225;border-radius:10px;padding:12px}
    .player video{width:100%;height:520px;background:#000;border-radius:6px}
    .player .title{display:flex;justify-content:space-between;align-items:center;padding-top:8px}
    .controls{display:flex;gap:8px;align-items:center}

    /* comments */
    .comments{margin-top:12px}
    .comment{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.02)}
    .comment .c-body p{margin:0}

    footer{padding:28px 0;text-align:center;color:var(--muted)}

    /* responsive */
    @media (max-width:900px){nav.sidebar{display:none} .player video{height:300px}}

  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <span class="mark" aria-hidden></span>
        <div>
          <div style="font-size:16px">MiniTube</div>
          <div style="font-size:12px;color:var(--muted)">A tiny YouTube-like demo</div>
        </div>
      </div>

      <div class="search">
        <input id="searchInput" placeholder="Search" aria-label="Search videos" />
        <button id="searchBtn">Search</button>
      </div>

      <div style="display:flex;gap:8px;align-items:center">
        <button id="themeToggle" title="Toggle theme">Theme</button>
      </div>
    </header>

    <main>
      <nav class="sidebar" aria-label="Main navigation">
        <div class="item">Home</div>
        <div class="item">Trending</div>
        <div class="item">Subscriptions</div>
        <div class="item">Library</div>
        <hr style="border:0;border-top:1px solid rgba(255,255,255,0.03);margin:8px 0">
        <div class="item">History</div>
        <div class="item">Watch later</div>
        <div class="item">Liked videos</div>
      </nav>

      <section class="content">
        <div class="top-row">
          <h2>Recommended</h2>
          <div class="filters">
            <button data-filter="all">All</button>
            <button data-filter="music">Music</button>
            <button data-filter="edu">Education</button>
          </div>
        </div>

        <div id="grid" class="grid">
          <!-- video cards inserted by JS -->
        </div>

        <footer>
          MiniTube demo — built with HTML/CSS/JS • No backend
        </footer>
      </section>
    </main>
  </div>

  <!-- Modal Player -->
  <div id="modal" class="modal" role="dialog" aria-hidden="true">
    <div class="player" role="document">
      <video id="playerVideo" controls poster="">
        <!-- source set by JS -->
      </video>
      <div class="title">
        <div>
          <h3 id="playerTitle" style="margin:0">Title</h3>
          <p id="playerViews" style="margin:6px 0 0;color:var(--muted)">0 views • Uploaded 1 day ago</p>
        </div>
        <div class="controls">
          <button id="closeBtn">Close</button>
          <button id="likeBtn">Like</button>
          <button id="shareBtn">Share</button>
        </div>
      </div>

      <div class="comments">
        <h4 style="margin:8px 0">Comments</h4>
        <div id="commentsList">
          <!-- comments go here -->
        </div>
        <div style="margin-top:8px;display:flex;gap:8px;align-items:flex-start">
          <input id="commentInput" placeholder="Add a public comment..." style="flex:1;padding:10px;border-radius:6px;background:var(--glass);border:0;color:inherit" />
          <button id="postComment">Post</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Sample data
    const videos = [
      {id:1,title:'Amazing Mountains — Short',duration:'3:14',views:'1.2M',src:'videos/sample1.mp4',category:'edu'},
      {id:2,title:'Lo-fi Beats to Relax',duration:'2:45',views:'530K',src:'videos/sample2.mp4',category:'music'},
      {id:3,title:'How to code in JS — Tutorial',duration:'12:03',views:'240K',src:'videos/sample3.mp4',category:'edu'},
      {id:4,title:'City Timelapse 4K',duration:'4:22',views:'86K',src:'videos/sample4.mp4',category:'all'},
      {id:5,title:'Nature Walk ASMR',duration:'8:01',views:'98K',src:'videos/sample5.mp4',category:'music'},
      {id:6,title:'History of Pakistan — Mini Doc',duration:'18:20',views:'320K',src:'videos/sample6.mp4',category:'edu'}
    ];

    const grid = document.getElementById('grid');
    const modal = document.getElementById('modal');
    const playerVideo = document.getElementById('playerVideo');
    const playerTitle = document.getElementById('playerTitle');
    const playerViews = document.getElementById('playerViews');
    const commentsList = document.getElementById('commentsList');

    function renderGrid(list){
      grid.innerHTML='';
      list.forEach(v=>{
        const card = document.createElement('article'); card.className='card';
        card.innerHTML = `
          <div class="thumb" data-id="${v.id}">
            <div style="font-size:13px;color:var(--muted)">Thumbnail</div>
            <div class="duration">${v.duration}</div>
          </div>
          <div class="meta">
            <div class="avatar" aria-hidden></div>
            <div class="info">
              <h4>${v.title}</h4>
              <p>${v.views} • Channel name</p>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      // attach click
      grid.querySelectorAll('.thumb').forEach(el=>el.addEventListener('click',()=>{
        const id = Number(el.dataset.id);
        openPlayer(id);
      }));
    }

    function openPlayer(id){
      const v = videos.find(x=>x.id===id);
      if(!v) return;
      playerVideo.pause();
      playerVideo.innerHTML='';
      const src = document.createElement('source'); src.src = v.src; src.type='video/mp4';
      playerVideo.appendChild(src);
      playerVideo.load();
      playerTitle.textContent = v.title;
      playerViews.textContent = `${v.views} • Uploaded recently`;
      // sample comments
      commentsList.innerHTML = `
        <div class="comment"><div class="avatar"></div><div class="c-body"><strong>Ali</strong><p>Great video!</p></div></div>
        <div class="comment"><div class="avatar"></div><div class="c-body"><strong>Sana</strong><p>Loved the cinematography.</p></div></div>
      `;
      modal.classList.add('open');
      modal.setAttribute('aria-hidden','false');
      playerVideo.play().catch(()=>{});
    }

    document.getElementById('closeBtn').addEventListener('click',()=>{
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden','true');
      playerVideo.pause();
    });

    document.getElementById('postComment').addEventListener('click',()=>{
      const text = document.getElementById('commentInput').value.trim();
      if(!text) return;
      const div = document.createElement('div'); div.className='comment';
      div.innerHTML = `<div class="avatar"></div><div class="c-body"><strong>You</strong><p>${escapeHtml(text)}</p></div>`;
      commentsList.prepend(div);
      document.getElementById('commentInput').value='';
    });

    // simple search/filter
    document.getElementById('searchBtn').addEventListener('click',()=>{
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      if(!q){ renderGrid(videos); return; }
      renderGrid(videos.filter(v=>v.title.toLowerCase().includes(q)));
    });

    document.querySelectorAll('.filters button').forEach(btn=>btn.addEventListener('click',()=>{
      const f = btn.dataset.filter;
      if(f==='all') renderGrid(videos);
      else renderGrid(videos.filter(v=>v.category===f));
    }));

    function escapeHtml(s){ return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;'); }

    // initial render
    renderGrid(videos);

    // theme toggle (simple)
    document.getElementById('themeToggle').addEventListener('click',()=>{
      if(document.documentElement.style.getPropertyValue('--bg')===''){
        document.documentElement.style.setProperty('--bg','#fff');
        document.documentElement.style.setProperty('--card','#f5f7fb');
        document.documentElement.style.setProperty('--muted','#556');
        document.documentElement.style.setProperty('--accent','#ff3333');
        document.body.style.color='#0a1724';
      } else {
        document.documentElement.style.removeProperty('--bg');
        document.documentElement.style.removeProperty('--card');
        document.documentElement.style.removeProperty('--muted');
        document.body.style.color='';
      }
    });

    // close modal on backdrop click
    modal.addEventListener('click',(e)=>{ if(e.target===modal){ modal.classList.remove('open'); playerVideo.pause(); } });

  </script>
</body>
</html>
