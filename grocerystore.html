<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pakistani Grocery Store</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
    header { background: green; color: white; padding: 15px; text-align: center; font-size: 24px; }
    .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; padding: 20px; }
    .card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); text-align: center; }
    .card img { width: 100%; height: 200px; object-fit: contain; }
    h2 { color: green; font-size: 20px; }
  </style>
</head>
<body>
  <header>Welcome to Pakistani Grocery Store</header>
  <div class="container">
    <!-- Atta Section -->
    <div class="card">
      <h2>Atta</h2>
      <img src="download.jpg" alt="Sunridge Atta">
      <p>Sunridge Chakki Atta – 5kg</p>
    </div>

    <!-- Basmati Rice Section -->
    <div class="card">
      <h2>Basmati Rice</h2>
      <img src="download (1).jpg" alt="Himalayan Chef Basmati Rice">
      <p>Himalayan Chef Basmati Rice – Super Kernel</p>
    </div>

    <!-- Daal Section -->
    <div class="card">
      <h2>Daal</h2>
      <img src="https://upload.wikimedia.org/wikipedia/commons/9/99/Arhar_dal.JPG" alt="Daal">
      <p>Arhar / Masoor / Moong Daal</p>
    </div>
  </div>
</body>
</html>
