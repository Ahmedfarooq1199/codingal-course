<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>General Knowledge Quiz — Pakistan (10 Questions)</title>
  <style>
    :root{--bg:#f7fbff;--card:#ffffff;--accent:#0b5ed7;--correct:#198754;--wrong:#dc3545}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;margin:0;background:linear-gradient(180deg,#eaf3ff,white);color:#0b2540}
    .wrap{max-width:820px;margin:32px auto;padding:20px}
    header{display:flex;align-items:center;gap:16px}
    h1{font-size:1.6rem;margin:0}
    p.lead{margin:8px 0 20px;color:#274564}
    .card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 6px 18px rgba(12,40,80,0.06)}
    .question{margin-bottom:14px}
    .qtxt{font-weight:600}
    .options{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
    .opt{border:1px solid #e3eef9;padding:10px;border-radius:8px;cursor:pointer;transition:transform .08s,box-shadow .12s;background:linear-gradient(180deg,#ffffff,#fbfdff)}
    .opt:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(11,94,215,0.06)}
    .opt.disabled{cursor:default;opacity:0.9}
    .meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
    .btn{background:var(--accent);color:white;padding:8px 12px;border-radius:8px;border:none;cursor:pointer}
    .small{font-size:.9rem;color:#375a7f}
    .result{margin-top:18px;padding:12px;border-radius:10px}
    .correct{background:rgba(25,135,84,0.08);border-left:4px solid var(--correct);}
    .wrong{background:rgba(220,53,69,0.06);border-left:4px solid var(--wrong);}
    .score{font-size:1.2rem;font-weight:700}
    footer{margin-top:18px;text-align:center;color:#3a5a7a;font-size:.9rem}
    @media (min-width:640px){.options{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" aria-hidden>
        <circle cx="12" cy="12" r="11" stroke="#0b5ed7" stroke-width="1.5" fill="#eef6ff" />
        <path d="M7 12h10M12 7v10" stroke="#0b5ed7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <h1>The House of Learning</h1>
        <p class="lead">Choose the correct answer. This quiz is suitable for primary-level students. Your score will show at the end.</p>
      </div>
    </header>

    <main class="card" id="quizCard">
      <div id="questions"></div>

      <div class="meta">
        <div class="small">Question <span id="current">0</span> of <span id="total">10</span></div>
        <div>
          <button class="btn" id="nextBtn">Next</button>
          <button class="btn" id="restartBtn" style="background:#6c757d;display:none">Restart</button>
        </div>
      </div>

      <div id="resultArea" style="display:none" class="result"></div>
    </main>

    <footer>
      Tip: After you finish, click "Restart" to try again or review the correct answers.
    </footer>
  </div>

  <script>
    // 10 multiple-choice questions about Pakistan
    const quiz = [
      {q: "What is the capital city of Pakistan?", a:["Karachi","Lahore","Islamabad","Peshawar"], correct:2},
      {q: "Who is known as the founder of Pakistan?", a:["Allama Iqbal","Muhammad Ali Jinnah","Liaquat Ali Khan","Abdul Sattar Edhi"], correct:1},
      {q: "When did Pakistan gain independence?", a:["14 August 1947","23 March 1956","25 December 1971","11 September 1948"], correct:0},
      {q: "What is the national language of Pakistan?", a:["Punjabi","Urdu","Sindhi","English"], correct:1},
      {q: "What is Pakistan's currency called?", a:["Rupee","Dollar","Taka","Rial"], correct:0},
      {q: "Which is Pakistan's highest mountain?", a:["Nanga Parbat","K2","Mount Everest","Gasherbrum I"], correct:1},
      {q: "Which sport is considered Pakistan's national sport?", a:["Cricket","Hockey","Football","Squash"], correct:1},
      {q: "Which flower is the national flower of Pakistan?", a:["Rose","Jasmine","Marigold","Sunflower"], correct:1},
      {q: "What is the national animal of Pakistan?", a:["Snow Leopard","Markhor","Lion","Tiger"], correct:1},
      {q: "Which sea lies to the south of Pakistan?", a:["Arabian Sea","Bay of Bengal","Red Sea","Mediterranean Sea"], correct:0}
    ];

    const total = quiz.length;
    document.getElementById('total').textContent = total;

    let index = 0;
    let score = 0;
    let answered = false;

    const questionsDiv = document.getElementById('questions');
    const currentEl = document.getElementById('current');
    const nextBtn = document.getElementById('nextBtn');
    const restartBtn = document.getElementById('restartBtn');
    const resultArea = document.getElementById('resultArea');

    function renderQuestion(i){
      const item = quiz[i];
      currentEl.textContent = i+1;
      answered = false;
      resultArea.style.display = 'none';

      const html = [];
      html.push('<div class="question">');
      html.push('<div class="qtxt">'+ (i+1) +'. '+ escapeHtml(item.q) +'</div>');
      html.push('<div class="options">');
      item.a.forEach((opt, idx) => {
        html.push(`<button class="opt" data-idx="${idx}">${escapeHtml(opt)}</button>`);
      });
      html.push('</div></div>');

      questionsDiv.innerHTML = html.join('');

      // attach handlers
      const optionEls = document.querySelectorAll('.opt');
      optionEls.forEach(el => el.addEventListener('click', onSelect));

      // update next btn text
      nextBtn.textContent = (i === total-1) ? 'Finish' : 'Next';
    }

    function onSelect(e){
      if(answered) return;
      answered = true;
      const selected = Number(e.currentTarget.dataset.idx);
      const correctIdx = quiz[index].correct;

      // disable all options
      document.querySelectorAll('.opt').forEach((el, idx) => {
        el.classList.add('disabled');
        el.disabled = true;
        if(idx === correctIdx){
          el.classList.add('correct');
        }
      });

      if(selected === correctIdx){
        score++;
        e.currentTarget.classList.add('correct');
        showResult(true, 'Correct!');
      } else {
        e.currentTarget.classList.add('wrong');
        showResult(false, 'Wrong — the correct answer is: ' + quiz[index].a[correctIdx]);
      }
    }

    function showResult(isRight, text){
      resultArea.style.display = 'block';
      resultArea.className = 'result ' + (isRight ? 'correct' : 'wrong');
      resultArea.textContent = text;
    }

    nextBtn.addEventListener('click', () => {
      if(!answered){
        // if user clicks Next without answering, show a gentle reminder
        if(!confirm('You have not selected an answer. Do you want to skip this question?')) return;
      }
      if(index < total-1){
        index++;
        renderQuestion(index);
      } else {
        showScore();
      }
    });

    restartBtn.addEventListener('click', () => {
      index = 0; score = 0; answered = false;
      restartBtn.style.display = 'none';
      document.getElementById('quizCard').scrollIntoView({behavior:'smooth'});
      renderQuestion(index);
    });

    function showScore(){
      questionsDiv.innerHTML = '';
      resultArea.style.display = 'block';
      resultArea.className = 'result';
      resultArea.innerHTML = `<div class="score">You scored ${score} out of ${total}.</div>` +
        `<div style="margin-top:10px">Review: </div>`;

      // list correct answers
      const list = document.createElement('ol');
      quiz.forEach(q => {
        const li = document.createElement('li');
        li.textContent = q.q + ' — ' + q.a[q.correct];
        list.appendChild(li);
      });
      resultArea.appendChild(list);

      nextBtn.style.display = 'none';
      restartBtn.style.display = 'inline-block';
    }

    function escapeHtml(s){
      return s.replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});
    }

    // initial render
    renderQuestion(index);
  </script>
</body>
</html>
